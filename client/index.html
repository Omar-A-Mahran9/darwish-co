<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!--
      The title, description, canonical address and social tags below are the
      homepage defaults. Every request is served with the metadata of the page
      it asked for: the server rewrites this head (server/seoHtml.ts) and the
      browser keeps it in step during navigation (client/src/hooks/useSeo.ts).
      Page metadata lives in shared/seo.ts.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Darwish &amp; Co. | Strategic Management &amp; Business Consulting in Egypt</title>
    <meta name="description" content="Darwish &amp; Co. is a consulting firm based in Egypt, helping organizations improve performance, strengthen governance, and pursue sustainable growth." />
    <!--
      Generated from the existing emblem asset (images/emblem-small.webp), the
      only symbol-only mark the site already has. A proper vector favicon
      still depends on the founder's source files (brand doc §10); this is a
      real, working icon in the meantime, not a placeholder.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two families only: Playfair Display for headings, Inter for everything else. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://darwish-co.com/" />
    <meta property="og:title" content="Darwish &amp; Co. | Strategic Management &amp; Business Consulting in Egypt" />
    <meta property="og:description" content="Darwish &amp; Co. is a consulting firm based in Egypt, helping organizations improve performance, strengthen governance, and pursue sustainable growth." />
    <meta property="og:image" content="https://darwish-co.com/images/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Darwish &amp; Co. | Strategic Management &amp; Business Consulting in Egypt" />
    <meta name="twitter:description" content="Darwish &amp; Co. is a consulting firm based in Egypt, helping organizations improve performance, strengthen governance, and pursue sustainable growth." />
    <meta name="twitter:image" content="https://darwish-co.com/images/logo.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://darwish-co.com/" />

    <!--
      Site-wide identity. Fields are limited to what is verified: legal name and
      form, founder and founding date, full address, registration identifiers,
      review aggregates and partner relationships are held back until confirmed
      (docs/entity-facts.md). sameAs lists the official social profiles
      (confirmed 25 Oct 2026). areaServed states delivery today (Egypt), not the
      target audience.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://darwish-co.com/#organization",
          "name": "Darwish & Co.",
          "url": "https://darwish-co.com/",
          "logo": "https://darwish-co.com/images/logo.png",
          "description": "Darwish & Co. is a governance and management consultancy based in New Cairo, Egypt, for SMEs in the MENA region.",
          "areaServed": { "@type": "Country", "name": "Egypt" },
          "sameAs": [
            "https://www.linkedin.com/company/darwishandcoeg/",
            "https://www.facebook.com/darwishandcoeg",
            "https://www.instagram.com/darwishandcoeg/"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "email": "info@darwish-co.com",
            "url": "https://darwish-co.com/contact"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://darwish-co.com/#website",
          "url": "https://darwish-co.com/",
          "name": "Darwish & Co.",
          "publisher": { "@id": "https://darwish-co.com/#organization" }
        }
      ]
    }
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Umami analytics is added at build time only when VITE_ANALYTICS_ENDPOINT and VITE_ANALYTICS_WEBSITE_ID are set (vite.config.ts). -->
  </body>

</html>
