<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;700;800&family=Inter:wght@300;400;500;600&family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.darwish-co.com/" />
    <meta property="og:title" content="Darwish & Co — Strategic Management & Business Consulting | MENA" />
    <meta property="og:description" content="Darwish & Co. is a strategic management and business consulting firm serving SMEs in the MENA region. Expert advisory in GRC, HR, Business Development, Digital Marketing, and Market Research." />
    <meta property="og:image" content="https://www.darwish-co.com/images/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Darwish & Co — Strategic Management & Business Consulting | MENA" />
    <meta name="twitter:description" content="Darwish & Co. is a strategic management and business consulting firm serving SMEs in the MENA region." />
    <meta name="twitter:image" content="https://www.darwish-co.com/images/logo.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.darwish-co.com/" />

    <!-- JSON-LD: Organization structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Darwish & Co.",
      "url": "https://www.darwish-co.com",
      "logo": "https://www.darwish-co.com/images/logo.png",
      "description": "Strategic management and business consulting firm serving SMEs in the MENA region. Expert advisory in GRC, HR, Business Development, Digital Marketing, and Market Research.",
      "areaServed": "MENA",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "url": "https://www.darwish-co.com/contact"
      },
      "sameAs": [
        "https://www.linkedin.com/company/darwish-co"
      ]
    }
    </script>

    <!-- JSON-LD: Service structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Darwish & Co. Consulting Services",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "item": {
            "@type": "Service",
            "name": "Strategic Management Consulting",
            "description": "Strategic planning, performance systems, and organisational design for MENA SMEs.",
            "provider": { "@type": "Organization", "name": "Darwish & Co." },
            "areaServed": "MENA"
          }
        },
        {
          "@type": "ListItem",
          "position": 2,
          "item": {
            "@type": "Service",
            "name": "Governance, Risk & Compliance (GRC)",
            "description": "GRC frameworks and compliance advisory for growth-stage businesses in Egypt and the Gulf.",
            "provider": { "@type": "Organization", "name": "Darwish & Co." },
            "areaServed": "MENA"
          }
        },
        {
          "@type": "ListItem",
          "position": 3,
          "item": {
            "@type": "Service",
            "name": "Human Resources Consulting",
            "description": "Strategic HR planning, talent acquisition, and HR compliance for MENA businesses.",
            "provider": { "@type": "Organization", "name": "Darwish & Co." },
            "areaServed": "MENA"
          }
        },
        {
          "@type": "ListItem",
          "position": 4,
          "item": {
            "@type": "Service",
            "name": "Market Research & Consumer Insights",
            "description": "Consumer research, brand health tracking, and market entry studies across the MENA region.",
            "provider": { "@type": "Organization", "name": "Darwish & Co." },
            "areaServed": "MENA"
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
