<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!--
      The title, description, canonical address and social tags below are the
      homepage defaults. Every request is served with the metadata of the page
      it asked for: the server rewrites this head (server/seoHtml.ts) and the
      browser keeps it in step during navigation (client/src/hooks/useSeo.ts).
      Page metadata lives in shared/seo.ts.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Delegate Decisions Without Losing Oversight | Darwish &amp; Co</title>
    <meta name="description" content="Governance and management consultancy in Egypt for SMEs across the MENA region — the governance, controls and strategy to delegate decisions without losing oversight." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two families only: Playfair Display for headings, Inter for everything else. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.darwish-co.com/" />
    <meta property="og:title" content="Delegate Decisions Without Losing Oversight | Darwish &amp; Co" />
    <meta property="og:description" content="Governance and management consultancy in Egypt for SMEs across the MENA region — the governance, controls and strategy to delegate decisions without losing oversight." />
    <meta property="og:image" content="https://www.darwish-co.com/images/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Delegate Decisions Without Losing Oversight | Darwish &amp; Co" />
    <meta name="twitter:description" content="Governance and management consultancy in Egypt for SMEs across the MENA region — the governance, controls and strategy to delegate decisions without losing oversight." />
    <meta name="twitter:image" content="https://www.darwish-co.com/images/logo.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.darwish-co.com/" />

    <!--
      Site-wide identity. Fields are limited to what is verified: legal name and
      form, founder and founding date, full address, registration identifiers,
      review aggregates, partner relationships and external profiles are held
      back until confirmed (docs/entity-facts.md). areaServed states delivery
      today (Egypt), not the target audience.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.darwish-co.com/#organization",
          "name": "Darwish & Co.",
          "url": "https://www.darwish-co.com/",
          "logo": "https://www.darwish-co.com/images/logo.png",
          "description": "Darwish & Co. is a governance and management consultancy based in New Cairo, Egypt, for SMEs in the MENA region.",
          "areaServed": { "@type": "Country", "name": "Egypt" },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "email": "info@darwish-co.com",
            "url": "https://www.darwish-co.com/contact"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.darwish-co.com/#website",
          "url": "https://www.darwish-co.com/",
          "name": "Darwish & Co.",
          "publisher": { "@id": "https://www.darwish-co.com/#organization" }
        }
      ]
    }
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
