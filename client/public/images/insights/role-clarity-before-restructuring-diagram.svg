<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" width="1200" height="554" role="img" aria-label="Clarify roles before you redraw the chart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="554" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="6" fill="#006BA3"/><text x="60" y="70" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#12324A" text-anchor="start">Clarify roles before you redraw the chart</text><text x="60" y="104" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5B6770" text-anchor="start">A six-step approach that lets evidence decide whether structure needs to change</text><rect x="60.0" y="150" width="345.3333333333333" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="94.0" cy="186" r="18" fill="#006BA3"/><text x="94.0" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="124.0" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Define the problem</text><text x="82.0" y="228.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Agree the outcomes that are going wrong</text><text x="82.0" y="248.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">before discussing structure.</text><rect x="427.3333333333333" y="150" width="345.3333333333333" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="461.3333333333333" cy="186" r="18" fill="#006BA3"/><text x="461.3333333333333" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="491.3333333333333" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Decision inventory</text><text x="449.3333333333333" y="228.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">List the recurring decisions that most</text><text x="449.3333333333333" y="248.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">affect those outcomes.</text><rect x="794.6666666666666" y="150" width="345.3333333333333" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="828.6666666666666" cy="186" r="18" fill="#006BA3"/><text x="828.6666666666666" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="858.6666666666666" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Map current practice</text><text x="816.6666666666666" y="228.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Record who actually makes, shapes and</text><text x="816.6666666666666" y="248.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">carries out each decision.</text><rect x="60.0" y="322" width="345.3333333333333" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="94.0" cy="358" r="18" fill="#006BA3"/><text x="94.0" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="124.0" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Agree accountabilities</text><text x="82.0" y="400.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">One accountable role per decision; clear</text><text x="82.0" y="420.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">responsible, consulted, informed.</text><rect x="427.3333333333333" y="322" width="345.3333333333333" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="461.3333333333333" cy="358" r="18" fill="#006BA3"/><text x="461.3333333333333" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="491.3333333333333" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Run and observe</text><text x="449.3333333333333" y="400.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Operate with clarified roles and track</text><text x="449.3333333333333" y="420.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">whether decisions move faster.</text><rect x="794.6666666666666" y="322" width="345.3333333333333" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="828.6666666666666" cy="358" r="18" fill="#006BA3"/><text x="828.6666666666666" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="858.6666666666666" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Decide on structure</text><text x="816.6666666666666" y="400.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Change the organization chart only if</text><text x="816.6666666666666" y="420.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">the evidence still calls for it.</text><text x="60" y="526" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="start">Illustrative framework. Darwish &amp; Co.</text></svg>