<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" width="1200" height="554" role="img" aria-label="Where AI bias can enter education decisions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="554" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="6" fill="#006BA3"/><text x="60" y="70" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#12324A" text-anchor="start">Where AI bias can enter education decisions</text><text x="60" y="104" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5B6770" text-anchor="start">Each entry point needs its own governance control</text><rect x="60.0" y="150" width="529.0" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="94.0" cy="186" r="18" fill="#006BA3"/><text x="94.0" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="124.0" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Admissions</text><text x="82.0" y="228.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Ranking applicants against historical patterns of success.</text><rect x="611.0" y="150" width="529.0" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="645.0" cy="186" r="18" fill="#006BA3"/><text x="645.0" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="675.0" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Scholarships</text><text x="633.0" y="228.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Repeating past regional or political imbalances.</text><rect x="60.0" y="322" width="529.0" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="94.0" cy="358" r="18" fill="#006BA3"/><text x="94.0" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="124.0" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Automated grading</text><text x="82.0" y="400.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Weaker results across languages, dialects and styles.</text><rect x="611.0" y="322" width="529.0" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="645.0" cy="358" r="18" fill="#006BA3"/><text x="645.0" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="675.0" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Student monitoring</text><text x="633.0" y="400.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Reading poor connectivity as disengagement.</text><text x="60" y="526" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="start">Illustrative framework. Darwish &amp; Co.</text></svg>