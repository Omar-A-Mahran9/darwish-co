<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-label="From strategy to monthly decisions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="730" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="6" fill="#006BA3"/><text x="60" y="70" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#12324A" text-anchor="start">From strategy to monthly decisions</text><text x="60" y="104" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5B6770" text-anchor="start">Each priority gets an owner, clear decision rights, a few measures and a review rhythm</text><circle cx="600.0" cy="400" r="200" fill="none" stroke="#C9D6DF" stroke-width="3" stroke-dasharray="8 8"/><rect x="430.0" y="144.0" width="340" height="112" rx="12" fill="#12324A" stroke="#006BA3" stroke-width="2"/><text x="600.0" y="182" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Priority and owner</text><text x="600.0" y="208.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">One board-approved priority, one</text><text x="600.0" y="226.9" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">accountable owner</text><rect x="750.0" y="344.0" width="340" height="112" rx="12" fill="#FFFFFF" stroke="#006BA3" stroke-width="2"/><text x="920.0" y="382" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="middle">Decision rights</text><text x="920.0" y="408.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="middle">What the owner decides alone, and what</text><text x="920.0" y="426.9" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="middle">needs approval</text><rect x="430.0" y="544.0" width="340" height="112" rx="12" fill="#FFFFFF" stroke="#006BA3" stroke-width="2"/><text x="600.0" y="582" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="middle">Measures</text><text x="600.0" y="608.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="middle">Leading, lagging and key risk</text><text x="600.0" y="626.9" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="middle">indicators with targets</text><rect x="110.0" y="344.0" width="340" height="112" rx="12" fill="#FFFFFF" stroke="#006BA3" stroke-width="2"/><text x="280.0" y="382" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="middle">Monthly review</text><text x="280.0" y="408.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="middle">Exceptions, decisions requested,</text><text x="280.0" y="426.9" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="middle">actions and escalation</text><polygon points="449.5786437626905,250.5786437626905 467.5786437626905,258.5786437626905 449.5786437626905,266.5786437626905" fill="#006BA3" transform="rotate(315 458.5786437626905 258.5786437626905)"/><polygon points="732.4213562373095,250.5786437626905 750.4213562373095,258.5786437626905 732.4213562373095,266.5786437626905" fill="#006BA3" transform="rotate(45 741.4213562373095 258.5786437626905)"/><polygon points="732.4213562373095,533.4213562373095 750.4213562373095,541.4213562373095 732.4213562373095,549.4213562373095" fill="#006BA3" transform="rotate(135 741.4213562373095 541.4213562373095)"/><polygon points="449.5786437626905,533.4213562373095 467.5786437626905,541.4213562373095 449.5786437626905,549.4213562373095" fill="#006BA3" transform="rotate(225 458.5786437626905 541.4213562373095)"/><text x="600.0" y="394" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#006BA3" text-anchor="middle">Monthly</text><text x="600.0" y="422" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#006BA3" text-anchor="middle">rhythm</text><text x="60" y="702" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="start">Illustrative framework. Darwish &amp; Co.</text></svg>