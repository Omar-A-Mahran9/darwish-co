<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 515" width="1200" height="515" role="img" aria-label="Where decision time actually goes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="515" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="6" fill="#006BA3"/><text x="60" y="70" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#12324A" text-anchor="start">Where decision time actually goes</text><text x="60" y="104" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5B6770" text-anchor="start">Short bursts of work separated by long waits at each handoff</text><rect x="60.0" y="170" width="150" height="90" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><text x="135.0" y="206.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#12324A" text-anchor="middle">Request raised</text><rect x="80.0" y="280" width="110" height="14" rx="3" fill="#006BA3"/><rect x="218.0" y="280" width="66.5" height="14" rx="3" fill="#F2C6A0"/><line x1="218.0" y1="215" x2="276.5" y2="215" stroke="#5B6770" stroke-width="2" stroke-dasharray="6 5"/><polygon points="284.5,215 274.5,209 274.5,221" fill="#5B6770"/><text x="251.25" y="200" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="middle">handoff</text><rect x="292.5" y="170" width="150" height="90" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><text x="367.5" y="206.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#12324A" text-anchor="middle">Department</text><text x="367.5" y="226.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#12324A" text-anchor="middle">review</text><rect x="312.5" y="280" width="110" height="14" rx="3" fill="#006BA3"/><rect x="450.5" y="280" width="66.5" height="14" rx="3" fill="#F2C6A0"/><line x1="450.5" y1="215" x2="509.0" y2="215" stroke="#5B6770" stroke-width="2" stroke-dasharray="6 5"/><polygon points="517.0,215 507.0,209 507.0,221" fill="#5B6770"/><text x="483.75" y="200" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="middle">handoff</text><rect x="525.0" y="170" width="150" height="90" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><text x="600.0" y="206.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#12324A" text-anchor="middle">Finance check</text><rect x="545.0" y="280" width="110" height="14" rx="3" fill="#006BA3"/><rect x="683.0" y="280" width="66.5" height="14" rx="3" fill="#F2C6A0"/><line x1="683.0" y1="215" x2="741.5" y2="215" stroke="#5B6770" stroke-width="2" stroke-dasharray="6 5"/><polygon points="749.5,215 739.5,209 739.5,221" fill="#5B6770"/><text x="716.25" y="200" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="middle">handoff</text><rect x="757.5" y="170" width="150" height="90" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><text x="832.5" y="206.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#12324A" text-anchor="middle">Legal review</text><rect x="777.5" y="280" width="110" height="14" rx="3" fill="#006BA3"/><rect x="915.5" y="280" width="66.5" height="14" rx="3" fill="#F2C6A0"/><line x1="915.5" y1="215" x2="974.0" y2="215" stroke="#5B6770" stroke-width="2" stroke-dasharray="6 5"/><polygon points="982.0,215 972.0,209 972.0,221" fill="#5B6770"/><text x="948.75" y="200" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="middle">handoff</text><rect x="990.0" y="170" width="150" height="90" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><text x="1065.0" y="206.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#12324A" text-anchor="middle">Final approval</text><rect x="1010.0" y="280" width="110" height="14" rx="3" fill="#006BA3"/><rect x="60" y="345" width="22" height="14" rx="3" fill="#006BA3"/><text x="92" y="358" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Touch time: someone is actually working on the item</text><rect x="60" y="375" width="22" height="14" rx="3" fill="#F2C6A0"/><text x="92" y="388" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Waiting: queues, unclear approvals, rework and duplicated checks</text><text x="60" y="435.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F2A33" text-anchor="start">Map one recurring decision end to end. Count the handoffs and approval layers, and compare elapsed time with touch time.</text><text x="60" y="457.95" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F2A33" text-anchor="start">The gaps, not the steps, are usually where the time goes.</text><text x="60" y="487" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="start">Illustrative only; widths are not to scale. Darwish &amp; Co.</text></svg>