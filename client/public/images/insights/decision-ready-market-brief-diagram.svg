<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Build the brief backwards from the decision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="620" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="6" fill="#006BA3"/><text x="60" y="70" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#12324A" text-anchor="start">Build the brief backwards from the decision</text><text x="60" y="104" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5B6770" text-anchor="start">Every section of a decision-ready market brief earns its place by changing or confirming the answer</text><rect x="60" y="150" width="1080" height="70" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><text x="600.0" y="180" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="middle">Decision question</text><text x="600.0" y="204" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="middle">What exactly are we deciding, and by when?</text><rect x="115" y="230" width="970" height="70" rx="10" fill="#FFFFFF" stroke="#C9D6DF"/><text x="600.0" y="260" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="middle">Critical assumptions</text><text x="600.0" y="284" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="middle">Which beliefs, if wrong, would change the answer?</text><rect x="170" y="310" width="860" height="70" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><text x="600.0" y="340" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="middle">Evidence</text><text x="600.0" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="middle">Market size logic, customers, competition, channel, price, regulation</text><rect x="225" y="390" width="750" height="70" rx="10" fill="#FFFFFF" stroke="#C9D6DF"/><text x="600.0" y="420" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="middle">Options compared</text><text x="600.0" y="444" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="middle">Two to four options against agreed criteria, with risks and unknowns</text><rect x="280" y="470" width="640" height="70" rx="10" fill="#12324A" stroke="#006BA3"/><text x="600.0" y="500" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Recommendation</text><text x="600.0" y="524" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">Preferred option, main reason, and confidence level</text><text x="60" y="592" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="start">Illustrative framework. Darwish &amp; Co.</text></svg>