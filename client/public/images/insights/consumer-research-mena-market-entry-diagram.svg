ans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Measure</text><text x="630.0" y="274.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Survey and retail audit to</text><text x="630.0" y="294.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">size segments and test price</text><text x="630.0" y="314.5" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">and concepts. Output: fact</text><text x="630.0" y="334.75" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">base.</text><polygon points="868.0,252.5 884.0,262.5 868.0,272.5" fill="#006BA3"/><rect x="888.0" y="150" width="252.0" height="225" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><rect x="888.0" y="150" width="252.0" height="52" rx="10" fill="#006BA3"/><rect x="888.0" y="190" width="252.0" height="12" fill="#006BA3"/><text x="906.0" y="184" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Phase 4</text><text x="906.0" y="238.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Decide and plan</text><text x="906.0" y="274.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Judge the evidence against</text><text x="906.0" y="294.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">agreed decision rules; build</text><text x="906.0" y="314.5" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" tex