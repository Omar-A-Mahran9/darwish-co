rt">Policies and payroll</text><text x="82.0" y="400.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Leave, overtime, flexible work, annual</text><text x="82.0" y="420.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">increment, anti-harassment.</text><rect x="427.3333333333333" y="322" width="345.3333333333333" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="461.3333333333333" cy="358" r="18" fill="#006BA3"/><text x="461.3333333333333" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="491.3333333333333" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Termination</text><text x="449.3333333333333" y="400.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">A written, step-by-step procedure for</text><text x="449.3333333333333" y="420.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">every exit route.</text><rect x="794.6666666666666" y="322" width="345.3333333333333" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="828.6666666666666" cy="358" r="18" fill="#006BA3"/><text x="828.6666666666666" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="858.6666666666666" y="364" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Records and calendar</text><text x="816.6666666666666" y="400.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Organized employee files and a calendar</text><text x="816.6666666666666" y="420.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">of filing deadlines.</text><text x="60" y="526" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="start">Illustrative framework. Darwish &amp; Co.</text></svg>