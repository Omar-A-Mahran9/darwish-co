<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" width="1200" height="554" role="img" aria-label="A practical HR compliance review" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="554" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="6" fill="#006BA3"/><text x="60" y="70" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#12324A" text-anchor="start">A practical HR compliance review</text><text x="60" y="104" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5B6770" text-anchor="start">Six areas to check against Egypt&#x27;s new labour law with your legal adviser</text><rect x="60.0" y="150" width="345.3333333333333" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="94.0" cy="186" r="18" fill="#006BA3"/><text x="94.0" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="124.0" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Inventory</text><text x="82.0" y="228.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Every employee, contract type, start</text><text x="82.0" y="248.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">date, salary and work arrangement.</text><rect x="427.3333333333333" y="150" width="345.3333333333333" height="150" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><circle cx="461.3333333333333" cy="186" r="18" fill="#006BA3"/><text x="461.3333333333333" y="192" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text