<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 455" width="1200" height="455" role="img" aria-label="A proportionate GRC roadmap for SMEs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="455" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="6" fill="#006BA3"/><text x="60" y="70" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#12324A" text-anchor="start">A proportionate GRC roadmap for SMEs</text><text x="60" y="104" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5B6770" text-anchor="start">Build governance, risk and compliance in phases rather than all at once</text><rect x="60.0" y="150" width="252.0" height="225" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><rect x="60.0" y="150" width="252.0" height="52" rx="10" fill="#12324A"/><rect x="60.0" y="190" width="252.0" height="12" fill="#12324A"/><text x="78.0" y="184" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Phase 1</text><text x="78.0" y="238.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Diagnose</text><text x="78.0" y="274.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Map ownership and decision</text><text x="78.0" y="294.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">rights; list applicable laws,</text><text x="78.0" y="314.5" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">licences and contracts. Four</text><text x="78.0" y="334.75" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">to six weeks.</text><polygon points="316.0,252.5 332.0,262.5 316.0,272.5" fill="#006BA3"/><rect x="336.0" y="150" width="252.0" height="225" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><rect x="336.0" y="150" width="252.0" height="52" rx="10" fill="#12324A"/><rect x="336.0" y="190" width="252.0" height="12" fill="#12324A"/><text x="354.0" y="184" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Phase 2</text><text x="354.0" y="238.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Foundations</text><text x="354.0" y="274.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Delegation of authority,</text><text x="354.0" y="294.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">compliance calendar, first</text><text x="354.0" y="314.5" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">risk register, urgent legal</text><text x="354.0" y="334.75" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">gaps. Two to three months.</text><polygon points="592.0,252.5 608.0,262.5 592.0,272.5" fill="#006BA3"/><rect x="612.0" y="150" width="252.0" height="225" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><rect x="612.0" y="150" width="252.0" height="52" rx="10" fill="#12324A"/><rect x="612.0" y="190" width="252.0" height="12" fill="#12324A"/><text x="630.0" y="184" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Phase 3</text><text x="630.0" y="238.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Policies and controls</text><text x="630.0" y="274.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Core policies, manager</text><text x="630.0" y="294.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">training, financial and</text><text x="630.0" y="314.5" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">system controls, speak-up</text><text x="630.0" y="334.75" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">channel. Three to six months.</text><polygon points="868.0,252.5 884.0,262.5 868.0,272.5" fill="#006BA3"/><rect x="888.0" y="150" width="252.0" height="225" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><rect x="888.0" y="150" width="252.0" height="52" rx="10" fill="#006BA3"/><rect x="888.0" y="190" width="252.0" height="12" fill="#006BA3"/><text x="906.0" y="184" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Phase 4</text><text x="906.0" y="238.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Embed and evidence</text><text x="906.0" y="274.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Quarterly risk review, annual</text><text x="906.0" y="294.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">control testing, an evidence</text><text x="906.0" y="314.5" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">file ready for lenders and</text><text x="906.0" y="334.75" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">clients.</text><text x="60" y="427" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="start">Illustrative framework. Darwish &amp; Co.</text></svg>