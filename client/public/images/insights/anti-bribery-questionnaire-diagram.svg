<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 455" width="1200" height="455" role="img" aria-label="A 30/60/90-day plan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="455" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="6" fill="#006BA3"/><text x="60" y="70" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#12324A" text-anchor="start">A 30/60/90-day plan</text><text x="60" y="104" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5B6770" text-anchor="start">From the first questionnaire to a programme you can evidence</text><rect x="60.0" y="150" width="344.0" height="225" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><rect x="60.0" y="150" width="344.0" height="52" rx="10" fill="#12324A"/><rect x="60.0" y="190" width="344.0" height="12" fill="#12324A"/><text x="78.0" y="184" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Days 1-30</text><text x="78.0" y="238.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Understand and respond honestly</text><text x="78.0" y="274.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Name an owner, gather existing evidence,</text><text x="78.0" y="294.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">answer accurately and state planned</text><text x="78.0" y="314.5" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">actions with dates.</text><polygon points="408.0,252.5 424.0,262.5 408.0,272.5" fill="#006BA3"/><rect x="428.0" y="150" width="344.0" height="225" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><rect x="428.0" y="150" width="344.0" height="52" rx="10" fill="#12324A"/><rect x="428.0" y="190" width="344.0" height="12" fill="#12324A"/><text x="446.0" y="184" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Days 31-60</text><text x="446.0" y="238.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Build the essentials</text><text x="446.0" y="274.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Risk assessment, approved policy, gifts</text><text x="446.0" y="294.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">register, third-party checks,</text><text x="446.0" y="314.5" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">confidential reporting channel.</text><polygon points="776.0,252.5 792.0,262.5 776.0,272.5" fill="#006BA3"/><rect x="796.0" y="150" width="344.0" height="225" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><rect x="796.0" y="150" width="344.0" height="52" rx="10" fill="#006BA3"/><rect x="796.0" y="190" width="344.0" height="12" fill="#006BA3"/><text x="814.0" y="184" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Days 61-90</text><text x="814.0" y="238.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12324A" text-anchor="start">Embed and evidence</text><text x="814.0" y="274.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">Train higher-risk roles, add contract</text><text x="814.0" y="294.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">clauses, brief the board, set a review</text><text x="814.0" y="314.5" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">date, update your response pack.</text><text x="60" y="427" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="start">Illustrative framework. Darwish &amp; Co.</text></svg>