<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 646" width="1200" height="646" role="img" aria-label="Delegate the decision, keep the oversight" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="646" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="6" fill="#006BA3"/><text x="60" y="70" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#12324A" text-anchor="start">Delegate the decision, keep the oversight</text><text x="60" y="104" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5B6770" text-anchor="start">How a Delegation of Authority framework moves decisions down and information back up</text><rect x="60" y="150" width="640" height="92" rx="10" fill="#12324A" stroke="#C9D6DF"/><text x="84" y="182" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Board</text><text x="84" y="208.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start">Strategy, budget, major acquisitions, significant borrowing, related-</text><text x="84" y="226.9" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start">party transactions</text><rect x="100" y="258" width="600" height="92" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><text x="124" y="290" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#12324A" text-anchor="start">CEO</text><text x="124" y="316.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="start">Decisions above departmental limits and anything with exclusivity</text><text x="124" y="334.9" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="start">or unusual risk</text><rect x="140" y="366" width="560" height="92" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><text x="164" y="398" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#12324A" text-anchor="start">CFO / function heads</text><text x="164" y="424.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="start">Approve within set limits; consulted on financial terms</text><rect x="180" y="474" width="520" height="92" rx="10" fill="#E8F1F7" stroke="#C9D6DF"/><text x="204" y="506" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#12324A" text-anchor="start">Department heads</text><text x="204" y="532.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1F2A33" text-anchor="start">Routine decisions within budget and written thresholds</text><line x1="770" y1="160" x2="770" y2="556" stroke="#006BA3" stroke-width="4"/><polygon points="760,542 770,562 780,542" fill="#006BA3"/><text x="792" y="190" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#006BA3" text-anchor="start">Authority is delegated</text><text x="792" y="216.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">within written limits: value,</text><text x="792" y="236.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">duration, exclusivity, risk</text><line x1="1060" y1="556" x2="1060" y2="160" stroke="#12324A" stroke-width="4"/><polygon points="1050,174 1060,154 1070,174" fill="#12324A"/><text x="792" y="496" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#12324A" text-anchor="start">Decisions are reported back</text><text x="792" y="522.0" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">monthly summaries, exception</text><text x="792" y="542.25" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1F2A33" text-anchor="start">reports, audit testing</text><text x="60" y="618" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6770" text-anchor="start">Illustrative framework. Darwish &amp; Co.</text></svg>